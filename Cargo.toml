[package]
name = "skin-sniper"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
axum = "0.8"
reqwest = { version = "0.13", features = ["json", "form", "multipart", "query", "gzip"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net", "process"] }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
http = "1.5.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
